<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Goldy Quote Live Test</title>
<style>
 body{font:14px system-ui,sans-serif;margin:0;padding:16px;max-width:1000px;margin:auto;color:#1a1a1a}
 h1{font-size:20px} textarea{width:100%;height:150px;font:12px ui-monospace,monospace}
 .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
 button{padding:8px 14px;border:0;border-radius:6px;background:#b8860b;color:#fff;cursor:pointer}
 button:disabled{opacity:.5} label{margin-right:10px}
 .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:12px}
 .card{border:1px solid #ccc;border-radius:8px;padding:10px}
 .card h3{margin:0 0 6px;text-transform:capitalize}
 .badge{display:inline-block;padding:2px 8px;border-radius:10px;background:#eee}
 .completed{background:#d4edda}.error{background:#f8d7da}.processing,.waiting_for_input{background:#d1ecf1}
 #log{height:200px;overflow:auto;background:#111;color:#9f9;padding:8px;font:12px ui-monospace,monospace;white-space:pre-wrap}
 #summary{font-weight:600;margin:10px 0}
</style></head><body>
<h1>Goldy Quote: all carriers live test</h1>
<div class="row" id="carriers"></div>
<textarea id="profile"></textarea>
<div class="row"><button id="run">Run all carriers to quote</button><span id="task"></span></div>
<div id="summary"></div>
<div class="grid" id="cards"></div>
<h3>Event log</h3><div id="log"></div>
<script>
const ALL=['geico','progressive','statefarm','libertymutual'];
const profile={firstName:'Test',lastName:'Driver',dateOfBirth:'1988-04-12',email:'test.driver@example.com',phone:'6125550142',streetAddress:'123 Main St',city:'Saint Paul',state:'MN',zipCode:'55330',housingType:'own',vehicleYear:'2019',vehicleMake:'Honda',vehicleModel:'Civic',ownership:'owned',primaryUse:'commute',annualMileage:'10000',gender:'male',maritalStatus:'single',education:'bachelors',employmentStatus:'employed',accidents:'none',violations:'none',continuousCoverage:'yes',liabilityLimit:'100/300'};
const $=id=>document.getElementById(id);
$('profile').value=JSON.stringify(profile,null,2);
$('carriers').innerHTML=ALL.map(c=>`<label><input type="checkbox" value="${c}" checked> ${c}</label>`).join('');
const log=m=>{const l=$('log');l.textContent+=`${new Date().toLocaleTimeString()} ${m}\n`;l.scrollTop=l.scrollHeight};
const api=async(p,o={})=>{const r=await fetch(p,{headers:{'Content-Type':'application/json'},...o});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||r.status);return j};
let ws;function connect(){ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);
 ws.onmessage=e=>{try{const m=JSON.parse(e.data);if(m.type!=='automation.snapshot')log(`${m.type} ${m.carrier||''} ${m.status||''} ${m.error||m.message||''}`)}catch{}}}
connect();
$('run').onclick=async()=>{
 const carriers=[...document.querySelectorAll('#carriers input:checked')].map(i=>i.value);
 let data;try{data=JSON.parse($('profile').value)}catch(e){return alert('Profile JSON invalid')}
 $('run').disabled=true;$('cards').innerHTML='';$('summary').textContent='';
 try{
  const {taskId}=await api('/api/quotes/start',{method:'POST',body:JSON.stringify({carriers,zipCode:data.zipCode,insuranceType:'auto'})});
  $('task').textContent=taskId;log('started '+taskId);
  $('cards').innerHTML=carriers.map(c=>`<div class="card" id="c_${c}"><h3>${c}</h3><span class="badge">starting</span><div class="d"></div></div>`).join('');
  const st={};const poll=async()=>{await Promise.all(carriers.map(async c=>{
    try{st[c]=await api(`/api/quotes/${taskId}_${c}/carriers/${c}/status`)}catch(e){st[c]={status:'unreachable',error:e.message}}
    const s=st[c];$(`c_${c}`).querySelector('.badge').className='badge '+s.status;
    $(`c_${c}`).querySelector('.badge').textContent=s.status;
    $(`c_${c}`).querySelector('.d').textContent=`step ${s.currentStep??'-'}${s.error?' | '+s.error:''}`}))};
  // wait for carriers to boot, then send the whole profile once
  const t0=Date.now();
  while(Date.now()-t0<90000){await poll();if(carriers.every(c=>st[c]&&!['initializing','unreachable'].includes(st[c].status)))break;await new Promise(r=>setTimeout(r,2000))}
  const r=await api(`/api/quotes/${taskId}/data`,{method:'POST',body:JSON.stringify(data)});log('data sent to '+r.carriersProcessing+' carriers');
  const t1=Date.now();
  while(Date.now()-t1<8*60000){await poll();
   if(carriers.every(c=>['completed','error'].includes(st[c].status)))break;await new Promise(r=>setTimeout(r,3000))}
  const ok=carriers.filter(c=>st[c].status==='completed');
  $('summary').textContent=`${ok.length}/${carriers.length} carriers reached a quote`+(ok.length<carriers.length?` (failed: ${carriers.filter(c=>!ok.includes(c)).join(', ')})`:'');
 }catch(e){log('ERROR '+e.message);$('summary').textContent=e.message}
 $('run').disabled=false};
</script></body></html>
